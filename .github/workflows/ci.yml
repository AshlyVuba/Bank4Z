name: Bank4Z CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  backend:
    name: Backend build & test
    runs-on: ubuntu-latest

    # A real Postgres instance for the job — Flyway actually runs its
    # migrations against this every time CI runs, so a bad migration
    # filename or path (like the folder-typo issue earlier) fails the
    # build immediately instead of silently doing nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bank4z
          POSTGRES_USER: bank4z_user
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bank4z_user"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: bank4z
          DB_USER: bank4z_user
          DB_PASSWORD: changeme
          JWT_SECRET: ci-only-secret-not-used-anywhere-real
        run: mvn -B clean verify

  frontend:
    name: Flutter analyze & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Static analysis
        working-directory: mobile-app
        # This is the check that would have caught the ApiConfig.java
        # mix-up immediately — analyze fails loudly on misplaced/invalid
        # Dart rather than letting it slip through unnoticed.
        run: flutter analyze

      - name: Run tests
        working-directory: mobile-app
        # continue-on-error for now since there are no test files yet —
        # remove this line once real widget/unit tests exist in test/,
        # so a broken test actually fails the pipeline.
        continue-on-error: true
        run: flutter test

  security-scan:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build for analysis
        run: mvn -B clean compile

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3